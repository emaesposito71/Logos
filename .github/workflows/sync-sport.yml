# Sincronizza i loghi delle squadre americane (ESPN) nella repo.
#
# Copre: NFL, NBA, WNBA, NHL, MLB, NCAA basket maschile/femminile, NCAA
# football (~1.000 squadre). Perché ESPN e non SportsLogos.net: il sito è
# dietro Cloudflare (challenge JavaScript) che blocca script e GitHub
# Actions; l'API di ESPN è pubblica e stabile, con la stessa qualità
# (PNG 500px → WebP).
#
# OUTPUT: cartella sport/ — UN file per squadra: <lega>/<slug>.webp ridotto
# a 512px (ideale per app Android telefono/TV, ~10-40 KB a logo). Produce
# anche sport/index.min.json, indice compatto per l'app.
#
# USO RUNTIME DELL'APP (esempio URL diretto, il repo fa da CDN):
#   https://raw.githubusercontent.com/emaesposito71/Logos/main/sport/nba/boston_celtics.webp
#   L'indice dei file: .../main/sport/index.min.json
#
# Quando gira:
#   - Manualmente: Actions -> "Sync sport logos" -> Run workflow.
#   - Automaticamente: OGNI ORA al minuto 30 (le 30 min di differenza dalla
#     run del calcio evitano che le due sync si sovrappongano).
#
# Rate limit / HTTP 429: lo script SI FERMA DA SOLO ma salva tutto (manifesto
# aggiornato ogni 50 loghi, commit dei file già scaricati). La run appare
# VERDE con un avviso giallo: è una pausa attesa, non un guasto. La run
# successiva riparte dal manifesto e scarica solo i mancanti.
#
# Per DISATTIVARE l'esecuzione oraria: elimina (o commenta) le righe
# "schedule:" qui sotto, oppure Actions -> Sync sport logos -> "..." ->
# "Disable workflow".
#
# ATTENZIONE: durante una run NON aggiungere/modificare file a mano nel repo
# (anche un piccolo commit fatto a metà run "sposta" il ramo remoto e può far
# fallire il push finale della run). La cartella sport/ la crea il bot da
# solo: non serve crearla.
#
# Richiede: Settings -> Actions -> General -> Workflow permissions = "Read
# and write" (già impostata per la sync del calcio).

name: Sync sport logos

on:
  workflow_dispatch:
    inputs:
      leagues:
        description: "Solo queste leghe (virgola: nfl,nba,wnba,nhl,mlb,ncaa-mb,ncaa-wb,ncaa-fb). Vuoto = tutte."
        required: false
        default: ""
      size:
        description: "Lato massimo in px del WebP (default 512; cambiarlo riscarica tutto)"
        required: false
        default: "512"
      limit:
        description: "Max loghi (vuoto = tutti; es. 20 per una prova)"
        required: false
        default: ""
      workers:
        description: "Download paralleli (4 di default; abbassa a 2 se vedi tanti 429)"
        required: false
        default: "4"
      delay:
        description: "Pausa in secondi prima di ogni richiesta (alza se vedi HTTP 429)"
        required: false
        default: "0.3"
      force:
        description: "Riscarica tutto da zero"
        required: false
        default: false
        type: boolean
  schedule:
    # Ogni ora al minuto 30 (UTC). Offset di 30 min rispetto alla sync del
    # calcio (minuto 0): le due run non si sovrappongono mai.
    - cron: "30 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-sport
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa Pillow (conversione WebP)
        run: python3 -m pip install --quiet pillow

      - name: Download loghi sport
        id: download
        run: |
          # Nelle run programmate (schedule) gli input del form sono VUOTI:
          # applichiamo quindi gli stessi default del modulo manuale.
          LEAGUES="${{ inputs.leagues }}"
          SIZE="${{ inputs.size }}"
          LIMIT="${{ inputs.limit }}"
          WORKERS="${{ inputs.workers }}"
          DELAY="${{ inputs.delay }}"
          FORCE="${{ inputs.force }}"
          [ -z "$SIZE" ] && SIZE="512"
          [ -z "$WORKERS" ] && WORKERS="4"
          [ -z "$DELAY" ] && DELAY="0.3"
          [ -z "$FORCE" ] && FORCE="false"
          ARGS=(--workers "$WORKERS" --delay "$DELAY" --size "$SIZE" --out sport)
          [ -n "$LEAGUES" ] && ARGS+=(--leagues "$LEAGUES")
          [ -n "$LIMIT" ] && ARGS+=(--limit "$LIMIT")
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          set +e
          python3 scripts/sport.py "${ARGS[@]}"
          code=$?
          set -e
          # Codice 3 = fermo per rate limit persistente. I progressi sono già
          # salvati nel manifesto: usciamo SENZA errore (run verde) perché è
          # una pausa attesa, non un guasto. Il commit qui sotto salva comunque
          # i loghi scaricati.
          if [ "$code" -eq 3 ]; then
            echo "aborted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      - name: Commit e push se ci sono novità
        if: always() && !cancelled()
        run: |
          if [ ! -d sport ]; then
            echo "Nessuna cartella da committare (il download non è mai partito)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Push di pacchetti grandi (migliaia di file): buffer HTTP più grande
          git config http.postBuffer 524288000
          git add -A -- sport
          if git diff --cached --quiet; then
            echo "Nessuna novità, niente da committare."
            exit 0
          fi
          N=$(git diff --cached --name-only | wc -l)
          git commit -m "chore: sync sport logos ($N file)"
          # Il remoto può essere cambiato durante la run (commit manuali o
          # l'altra sync): riallineiamo e riproviamo 3 volte.
          ok=""
          for i in 1 2 3; do
            echo "Tentativo push $i/3..."
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "$GITHUB_REF_NAME"; then
              ok="1"
              break
            fi
            echo "Push non riuscito al tentativo $i: riprovo tra 10s"
            sleep 10
          done
          if [ -z "$ok" ]; then
            git rebase --abort 2>/dev/null || true
            echo "::error::Push non riuscito dopo 3 tentativi. I file di questa run non sono arrivati sul repo: rilancia il workflow (riparte dai loghi mancanti)."
            exit 1
          fi
          echo "Push riuscito."

      - name: Esito
        if: always() && steps.download.outcome != 'skipped'
        run: |
          N=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('count',0))" sport/index.json 2>/dev/null || echo "?")
          if [ "${{ steps.download.outputs.aborted }}" = "true" ]; then
            echo "::warning::Rate limit: la run si è fermata, ma è tutto salvato. Loghi sport già pronti: $N (target ≈ 1.000). La prossima esecuzione (automatica entro un'ora, o manuale) riparte da qui e scarica solo i mancanti."
            {
              echo "### ⏸️ Fermata per rate limit — è tutto normale"
              echo ""
              echo "- Loghi sport già pronti: **$N** su ≈ 1.000"
              echo "- Nulla è perso: i loghi scaricati sono stati committati"
              echo "- La prossima run (entro un'ora) riprende da qui da sola"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### ✅ Run completata senza interruzioni"
            echo ""
            echo "Loghi sport pronti: **$N**. Nel riepilogo qui sotto: se \"Saltati"
            echo "(già aggiornati)\" è uguale a \"Loghi elaborati\" e \"Falliti: 0\","
            echo "la sincronizzazione è al completo. 🎉"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Run completata."
