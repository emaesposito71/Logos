# Sincronizza i loghi da football-logos.cc nella repo.
#
# DUE FORMATI (scelta al lancio manuale, default: webp):
#   - "webp"    → cartella loghi/  — UN file per logo: <paese>/<slug>.webp,
#                 ridotto a 512px (ideale per app Android telefono/TV, ~15-40 KB
#                 a logo). Solo 1 richiesta HTTP per logo: meno 429. Produce
#                 anche loghi/index.min.json, indice compatto per l'app.
#   - "png-svg" → cartella calcio/ — archivio completo PNG 512 + SVG.
#
# USO RUNTIME DELL'APP (esempio URL diretto, il repo fa da CDN):
#   https://raw.githubusercontent.com/emaesposito71/Logos/main/loghi/italy/juventus.webp
#   L'indice dei file: .../main/loghi/index.min.json
#
# Quando gira:
#   - Manualmente: Actions -> "Sync football logos" -> Run workflow.
#   - Automaticamente: OGNI ORA (vedi "schedule" qui sotto).
#
# Rate limit / HTTP 429: lo script SI FERMA DA SOLO ma salva tutto (manifesto
# aggiornato ogni 50 loghi, commit dei file già scaricati). La run appare
# VERDE con un avviso giallo: è una pausa attesa, non un guasto. La run
# successiva riparte dal manifesto e scarica solo i mancanti.
#
# Per DISATTIVARE l'esecuzione oraria: elimina (o commenta) le righe
# "schedule:" qui sotto, oppure Actions -> Sync football logos -> "..." ->
# "Disable workflow".
#
# Richiede: Settings -> Actions -> General -> Workflow permissions = "Read and write".

name: Sync football logos

on:
  workflow_dispatch:
    inputs:
      format:
        description: "Formato: webp = leggero per app (cartella loghi/), png-svg = archivio (cartella calcio/)"
        type: choice
        options:
          - "webp"
          - "png-svg"
        default: "webp"
        required: true
      webp_size:
        description: "Lato massimo in px (solo formato webp)"
        required: false
        default: "512"
      countries:
        description: "Solo questi paesi (virgola, es. italy,spain). Vuoto = tutti."
        required: false
        default: ""
      limit:
        description: "Max loghi (vuoto = tutti; es. 20 per una prova)"
        required: false
        default: ""
      workers:
        description: "Download paralleli (4 è prudente contro i rate-limit)"
        required: false
        default: "4"
      delay:
        description: "Pausa in secondi prima di ogni richiesta (alza se vedi HTTP 429)"
        required: false
        default: "0.5"
      force:
        description: "Riscarica tutto da zero"
        required: false
        default: false
        type: boolean
  schedule:
    # Ogni ora in punto (l'orario del cron è UTC: in Italia -2 in estate,
    # -1 in inverno, ma per "ogni ora" non cambia nulla).
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-logos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa Pillow (conversione WebP)
        run: python3 -m pip install --quiet pillow

      - name: Download logos
        id: download
        run: |
          # Nelle run programmate (schedule) gli input del form sono VUOTI:
          # applichiamo quindi gli stessi default del modulo manuale.
          FORMAT="${{ inputs.format }}"
          WEBP_SIZE="${{ inputs.webp_size }}"
          COUNTRIES="${{ inputs.countries }}"
          LIMIT="${{ inputs.limit }}"
          WORKERS="${{ inputs.workers }}"
          DELAY="${{ inputs.delay }}"
          FORCE="${{ inputs.force }}"
          [ -z "$FORMAT" ] && FORMAT="webp"
          [ -z "$WEBP_SIZE" ] && WEBP_SIZE="512"
          [ -z "$WORKERS" ] && WORKERS="4"
          [ -z "$DELAY" ] && DELAY="0.5"
          [ -z "$FORCE" ] && FORCE="false"
          ARGS=(--workers "$WORKERS" --delay "$DELAY")
          if [ "$FORMAT" = "webp" ]; then
            ARGS+=(--webp "$WEBP_SIZE" --out loghi)
          else
            ARGS+=(--sizes 512 --out calcio)
          fi
          [ -n "$COUNTRIES" ] && ARGS+=(--countries "$COUNTRIES")
          [ -n "$LIMIT" ] && ARGS+=(--limit "$LIMIT")
          [ "$FORCE" = "true" ] && ARGS+=(--force)
          set +e
          python3 scripts/calcio.py "${ARGS[@]}"
          code=$?
          set -e
          # Codice 3 = fermo per rate limit persistente del CDN. I progressi
          # sono già salvati nel manifesto: usciamo SENZA errore (run verde)
          # perché è una pausa attesa, non un guasto. Il commit qui sotto
          # salva comunque i loghi scaricati.
          if [ "$code" -eq 3 ]; then
            echo "aborted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      - name: Commit e push se ci sono novità
        if: always() && !cancelled()
        run: |
          if [ ! -d calcio ] && [ ! -d loghi ]; then
            echo "Nessuna cartella da committare (il download non è mai partito)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- calcio loghi
          if git diff --cached --quiet; then
            echo "Nessuna novità, niente da committare."
          else
            N=$(git diff --cached --name-only | wc -l)
            git commit -m "chore: sync football logos ($N file)"
            git push
          fi

      - name: Esito
        if: always() && steps.download.outcome != 'skipped'
        run: |
          if [ -f loghi/index.json ]; then M=loghi/index.json; else M=calcio/index.json; fi
          N=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('count',0))" "$M" 2>/dev/null || echo "?")
          if [ "${{ steps.download.outputs.aborted }}" = "true" ]; then
            echo "::warning::Rate limit del CDN: la run si è fermata, ma è tutto salvato. Loghi già pronti: $N (target ≈ 4.500). La prossima esecuzione (automatica entro un'ora, o manuale) riparte da qui e scarica solo i mancanti."
            {
              echo "### ⏸️ Fermata per rate limit — è tutto normale"
              echo ""
              echo "- Loghi già pronti: **$N** su ≈ 4.500"
              echo "- Nulla è perso: i loghi scaricati sono stati committati"
              echo "- La prossima run (entro un'ora) riprende da qui da sola"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### ✅ Run completata senza interruzioni"
            echo ""
            echo "Loghi pronti: **$N**. Nel riepilogo qui sotto: se \"Saltati"
            echo "(già aggiornati)\" è uguale a \"Loghi elaborati\" e \"Falliti: 0\","
            echo "la sincronizzazione è al completo. 🎉"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Run completata."
